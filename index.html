<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"><title>TOPページ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background: #ffffff; color: #1e1e1e; font-size: 16px; }
  a { color: #1e1e1e; text-decoration: none; }
  a:hover { text-decoration: underline; }
  /* Typography */
  .t-h1 { font-size: 48px; font-weight: 700; line-height: 1.2; }
  .t-h2 { font-size: 24px; font-weight: 700; line-height: 1.3; }
  .t-body { font-size: 16px; line-height: 1.6; }
  .t-sub  { font-size: 14px; color: #757575; }
  /* Buttons */
  .btn { display: inline-block; background: #2c2c2c; color: #fff; border-radius: 8px;
         padding: 12px 24px; font-size: 16px; font-weight: 600; cursor: pointer; border: none; }
  .btn:hover { opacity: .85; }
  /* Cards */
  .card { background: #ffffff; border: 1px solid #d9d9d9; border-radius: 12px; padding: 24px; }
  /* Panels */
  .panel      { background: #f5f5f5; border-radius: 16px; padding: 32px; }
  .panel-dark { background: #2c2c2c;  border-radius: 16px; padding: 32px; color: #fff; }
  /* Layout helpers */
  .container { width: 743px; min-height: 508px; position: relative; }
  /* Header */
  .header { background: #f5f5f5; height: 56px; display: flex; align-items: center;
            justify-content: space-between; padding: 0 24px; border-bottom: 1px solid #d9d9d9; }
  .header-logo { font-size: 14px; font-weight: 700; color: #1e1e1e; }
  .header-nav { display: flex; align-items: center; gap: 8px; }
  .header-nav a { font-size: 12px; padding: 4px 8px; border-radius: 4px; color: #1e1e1e; }
  .header-nav a:hover { background: #d9d9d9; text-decoration: none; }
  .header-nav a.active { font-weight: 700; }
  .header-sep { color: #d9d9d9; font-size: 10px; }
  /* Footer */
  .footer { background: #2c2c2c; color: #fff; text-align: center;
            padding: 16px 24px; font-size: 12px; }
  /* Breadcrumb */
  .breadcrumb { font-size: 11px; color: #757575; padding: 8px 24px;
                background: #ffffff; border-bottom: 1px solid #d9d9d9; }
  .breadcrumb a { color: #757575; }
  /* Image placeholder */
  .img-placeholder { background: #f5f5f5; display: flex; align-items: center;
                     justify-content: center; color: #757575; font-size: 14px; }

  .hero { height: 280px; background: #f5ddb4; display:flex; flex-direction:column;
          align-items:center; justify-content:center; gap:16px; padding: 48px; }
  .intro-section { padding: 32px 24px; background: #f5f5f5; border-radius:0; }
  .intro-section p { color: #757575; margin-top:8px; }
</style>
</head>
<body>
<div class="container">
  <header class="header"><span class="header-logo">ヘッダー</span><nav class="header-nav"><a href="top.html" class="active">TOPページ</a><span class="header-sep">|</span><a href="menu.html">メニュー</a><span class="header-sep">|</span><a href="info.html">店舗情報・アクセス</a><span class="header-sep">|</span><a href="news.html">お知らせ</a></nav></header>
  <section class="hero img-placeholder">
    <p class="t-sub">画像エリア</p>
  </section>
  <section class="intro-section">
    <h2 class="t-h2">店の紹介</h2>
    <p class="t-body">本文テキストがここに入ります。</p>
  </section>
  <footer class="footer">フッター</footer>
</div>
</body>
</html>
